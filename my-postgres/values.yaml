image:
  repository: postgres
  tag: "16"

postgres:
  database: postgres
  user: postgres
  # Secret created manually (see README), containing the admin password.
  existingSecret: postgres-credentials
  existingSecretPasswordKey: password

# TLS material created manually via `tctl auth sign --format=db` (see README).
# Used to secure Postgres with mutual TLS so Teleport can broker access.
tls:
  existingSecret: postgres-tls
  certFile: server.crt
  keyFile: server.key
  caFile: server.cas
